<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an Event - Quirky Screenings</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="static/style/style.css" rel="stylesheet">
</head>
<body class="qs-body">

<header>
  <nav class="navbar navbar-expand-lg qs-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Quirky Screenings</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="create-event.html">Create an Event</a></li>
          <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Log In</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="qs-filmstrip"></div>
</header>

<main class="container py-5">
  <h1 class="qs-heading mb-3">Create a Screening</h1>

  <div class="qs-form-panel">
    <form>

      <h2 class="qs-heading h5 mb-3">Film Details</h2>
      <div class="row g-3 mb-4">
        <div class="col-md-8">
          <label for="filmTitle" class="form-label">Film title</label>
          <input type="text" class="form-control" id="filmTitle" required>
        </div>
        <div class="col-md-4">
          <label for="classification" class="form-label">Classification</label>
          <select class="form-select" id="classification" required>
            <option selected disabled value="">Select...</option>
            <option>G</option>
            <option>PG</option>
            <option>M</option>
            <option>MA15+</option>
            <option>R18+</option>
          </select>
        </div>
        <div class="col-12">
          <label for="synopsis" class="form-label">Synopsis</label>
          <textarea class="form-control" id="synopsis" rows="4" required></textarea>
        </div>
        <div class="col-md-4">
          <label for="runtime" class="form-label">Runtime (minutes)</label>
          <input type="number" class="form-control" id="runtime" min="1" required>
        </div>
        <div class="col-md-4">
          <label for="format" class="form-label">Screening format</label>
          <select class="form-select" id="format">
            <option>Digital</option>
            <option>35mm</option>
            <option>Director's Cut</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="category" class="form-label">Category</label>
          <select class="form-select" id="category" required>
            <option selected disabled value="">Select...</option>
            <option>Cult Classic</option>
            <option>Foreign Language</option>
            <option>Documentary</option>
            <option>Arthouse & Independent</option>
            <option>Musicals</option>
            <option>Blockbuster</option>
          </select>
        </div>
        <div class="col-12">
          <label for="poster" class="form-label">Poster image URL</label>
          <input type="text" class="form-control" id="poster">
          <div class="form-text">Paste a link to an image of the film poster.</div>
        </div>
      </div>

      <h2 class="qs-heading h5 mb-3">Venue & Session</h2>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="venueName" class="form-label">Venue name</label>
          <input type="text" class="form-control" id="venueName" required>
        </div>
        <div class="col-md-6">
          <label for="venueAddress" class="form-label">Venue address</label>
          <input type="text" class="form-control" id="venueAddress" required>
        </div>
        <div class="col-md-4">
          <label for="eventDate" class="form-label">Date</label>
          <input type="date" class="form-control" id="eventDate" required>
        </div>
        <div class="col-md-4">
          <label for="startTime" class="form-label">Start time</label>
          <input type="time" class="form-control" id="startTime" required>
        </div>
        <div class="col-md-4">
          <label for="endTime" class="form-label">End time</label>
          <input type="time" class="form-control" id="endTime" required>
        </div>
      </div>

      <h2 class="qs-heading h5 mb-3">Tickets</h2>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="ticketPrice" class="form-label">Ticket price ($)</label>
          <input type="number" class="form-control" id="ticketPrice" min="0" step="0.01" required>
        </div>
        <div class="col-md-6">
          <label for="ticketsAvailable" class="form-label">Tickets available</label>
          <input type="number" class="form-control" id="ticketsAvailable" min="1" required>
          <div class="form-text">Set this to match your venue's capacity.</div>
        </div>
      </div>

      <h2 class="qs-heading h5 mb-3">Acknowledgement of Country</h2>
      <div class="mb-4">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="acknowledgement" id="ackNone" value="none">
          <label class="form-check-label" for="ackNone">No Acknowledgement</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="acknowledgement" id="ackGeneric" value="generic" checked>
          <label class="form-check-label" for="ackGeneric">Generic Acknowledgement</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="acknowledgement" id="ackEnhanced" value="enhanced">
          <label class="form-check-label" for="ackEnhanced">Enhanced Acknowledgement</label>
        </div>
      </div>

      <button type="submit" class="btn qs-btn-gold px-4">Publish Event</button>
    </form>
  </div>
</main>

<div class="qs-filmstrip"></div>

<footer class="qs-footer">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <p class="mb-2 mb-md-0"> 2026 Quirky Screenings.</p>
    <div>
      <a href="#" class="me-3">About Us</a>
      <a href="#" class="me-3">Contact</a>
      <a href="#" class="me-3">Terms</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
