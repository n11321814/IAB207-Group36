{% extends "base.html" %}
{% block title %}{{ heading }} - Quirky Screenings{% endblock %}
{% from "bootstrap5/form.html" import render_form %}

{% block content %}
<div class="container my-4 py-3">
    <div class="page-header">
        <h4>{{ heading }}</h4>
    </div>

    <div class="col-md-6">
        {{ render_form(form) }}
    </div>

    {% if heading == 'Login' %}
    <div class="col-md-4">
        <p>New user? <a href="{{ url_for('auth.register') }}">Click here</a> to register.</p>
    </div>
    {% endif %}
</div>
{% endblock %}
